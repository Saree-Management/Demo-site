<title>SareeOps Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Marcellus&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell = topbar + sidebar (full ≥1024, icons 768–1023, drawer <768) + content column; cards only for objects, tables become card lists on phones */
:root{
  --bg:#f5f4f7; --surface:#ffffff; --surface-2:#efedf2; --fg:#1e1b24; --muted:#67626f; --border:#e1dee6; --hover:#f1eff4;
  --primary:#7a1f2b; --primary-fg:#ffffff; --secondary:#b8892b; --secondary-fg:#1e1b24;
  --button:#7a1f2b; --button-fg:#ffffff; --sidebar:var(--surface); --sidebar-fg:var(--fg); --danger-fg:#ffffff;
  --link:var(--primary); --ring:var(--primary); --chart-1:var(--primary); --chart-2:var(--secondary);
  --ok:#17663f; --ok-bg:#e3f4ea; --warn:#8a4b00; --warn-bg:#fdf0dc; --danger:#a8261b; --danger-bg:#fde6e3; --info:#1d5797; --info-bg:#e3eefb; --neutral:#4f4a58; --neutral-bg:#ecebef;
  --f-body:"Hind Madurai","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Marcellus",Georgia,"Noto Sans Tamil",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(30,20,40,.06),0 4px 16px rgba(30,20,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131217; --surface:#1b1a20; --surface-2:#24222a; --fg:#ecebf0; --muted:#a29dab; --border:#33303a; --hover:#26242c;
  --link:color-mix(in oklab,var(--primary) 45%,#fff); --ring:color-mix(in oklab,var(--primary) 45%,#fff);
  --ok:#6fd39f; --ok-bg:#12321f; --warn:#f2b45a; --warn-bg:#3a2a10; --danger:#ff8f84; --danger-bg:#3d1714; --info:#8ab9f1; --info-bg:#132a45; --neutral:#c4c0cc; --neutral-bg:#2b2931; --danger-fg:#1b0a08;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131217; --surface:#1b1a20; --surface-2:#24222a; --fg:#ecebf0; --muted:#a29dab; --border:#33303a; --hover:#26242c;
  --link:color-mix(in oklab,var(--primary) 45%,#fff); --ring:color-mix(in oklab,var(--primary) 45%,#fff);
  --ok:#6fd39f; --ok-bg:#12321f; --warn:#f2b45a; --warn-bg:#3a2a10; --danger:#ff8f84; --danger-bg:#3d1714; --info:#8ab9f1; --info-bg:#132a45; --neutral:#c4c0cc; --neutral-bg:#2b2931; --danger-fg:#1b0a08;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
html[lang="ta"] body{font-family:"Noto Sans Tamil","Hind Madurai",system-ui,sans-serif;font-size:14.5px}
*{box-sizing:border-box}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
html[lang="ta"] .eyebrow{letter-spacing:0;text-transform:none}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:500;text-align:center;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--button);color:var(--button-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--secondary);color:var(--secondary-fg);border-color:transparent}
.btn.danger{background:var(--danger);color:var(--danger-fg);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:inherit;position:relative}
.icon-btn:hover{background:color-mix(in oklab,currentColor 10%,transparent)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:500;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.in,select.in,textarea.in{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-weight:400}
textarea.in{min-height:80px}
.in:focus{border-color:var(--ring)}
.in.err{border-color:var(--danger)}
.errmsg{color:var(--danger);font-size:.8rem;font-weight:400}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.form-grid .span2{grid-column:span 2}
@media (max-width:520px){.form-grid .span2{grid-column:auto}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer;min-height:32px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.danger{background:var(--danger-bg);color:var(--danger)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.brand{background:color-mix(in oklab,var(--secondary) 22%,var(--surface));color:var(--fg)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--surface-2);font-size:.78rem;color:var(--muted)}

/* ---------- public pages ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-art{position:relative;overflow:hidden;background:var(--auth-bg,#2b2530);color:#f6f1e8;padding:40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.auth-art > *{position:relative}
.auth-art .brandline{font-family:var(--f-display);font-size:2.2rem;line-height:1.1;max-width:14ch}
.auth-art p{max-width:40ch;color:#e9e1d4}
.auth-main{display:flex;flex-direction:column;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.auth-card{width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;gap:16px;padding-block:24px}
.auth-card h1{font-family:var(--f-display);font-weight:400;font-size:1.9rem}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.15rem}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{min-height:220px;padding:24px max(16px,env(safe-area-inset-left,0px))}.auth-art .brandline{font-size:1.6rem}.auth-art .hide-sm{display:none}}

/* ---------- language toggle ---------- */
.lang{display:inline-flex;border:1px solid color-mix(in oklab,currentColor 30%,transparent);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;background:transparent;min-height:30px;min-width:40px;padding:0 10px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:600;color:inherit}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-height:100%}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;min-height:60px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--primary);color:var(--primary-fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--primary)}
.topbar .appname{font-family:var(--f-display);font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.logo{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--secondary);color:var(--secondary-fg);font-family:var(--f-display);font-size:1.1rem;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto;color:inherit;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.search{flex:1 1 320px;max-width:440px;margin-left:auto;position:relative}
.search input{width:100%;min-height:40px;border-radius:999px;border:0;padding:6px 14px 6px 38px;background:color-mix(in oklab,var(--primary-fg) 16%,transparent);color:var(--primary-fg)}
.search input::placeholder{color:color-mix(in oklab,var(--primary-fg) 75%,transparent)}
.search .ico{position:absolute;left:12px;top:10px;opacity:.85}
.search-pop{position:absolute;top:46px;left:0;right:0;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:50}
.search-pop button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:7px;cursor:pointer;min-height:40px}
.search-pop button:hover{background:var(--hover)}
.badge{position:absolute;top:6px;right:5px;min-width:18px;height:18px;border-radius:9px;background:var(--secondary);color:var(--secondary-fg);font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:color-mix(in oklab,var(--primary-fg) 22%,transparent);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.menu-btn{display:none}
.search-toggle{display:none}
.sidebar{background:var(--sidebar);color:var(--sidebar-fg);border-right:1px solid var(--border);padding:12px 10px 24px;overflow-y:auto;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));height:calc(100vh - 60px - env(safe-area-inset-top,0px))}
.nav-group{margin-top:14px}
.nav-group > .eyebrow{padding:0 10px 4px;color:color-mix(in oklab,var(--sidebar-fg) 60%,transparent)}
.nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;font-size:.93rem;line-height:1.25}
.nav a:hover{background:color-mix(in oklab,var(--sidebar-fg) 7%,transparent)}
.nav a.active{background:color-mix(in oklab,var(--secondary) 26%,transparent);font-weight:600;box-shadow:inset 3px 0 0 var(--secondary)}
.nav a .lbl{min-width:0}
.content{min-width:0;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.content-inner{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.scrim{display:none}
@media (min-width:768px) and (max-width:1023px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .sidebar{padding:10px 8px}
  .nav a{justify-content:center;padding:6px}
  .nav a .lbl,.nav-group > .eyebrow{display:none}
  .nav-group{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
}
@media (max-width:767px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-grid}
  .sidebar{position:fixed;z-index:60;left:0;top:0;bottom:0;height:auto;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:max(10px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .search{display:none;position:absolute;left:8px;right:8px;top:62px;max-width:none}
  .search.open{display:block}
  .search input{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);border:1px solid var(--border)}
  .search input::placeholder{color:var(--muted)}
  .search-toggle{display:inline-grid;margin-left:auto}
  .topbar .logo{width:34px;height:34px}
  .hide-xs{display:none!important}
}

/* ---------- page pattern ---------- */
.crumbs{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--link)}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:767px){
  .page-head .actions .btn.primary.main{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;min-height:50px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-width:0}
.card > h2,.card > .card-h{margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:1fr}}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}}
@media (min-width:1440px){.g4.grow{grid-template-columns:repeat(4,minmax(0,1fr))}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .in{width:auto;min-width:140px;flex:0 1 200px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:.86rem;min-height:32px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);font-weight:600}

/* kpi */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:.8rem;font-weight:600}
.up{color:var(--ok)} .down{color:var(--danger)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:.8rem;color:var(--muted);padding:9px 12px;white-space:nowrap}
.t td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--hover)}
.t td:first-child,.t th:first-child{position:sticky;left:0;background:inherit}
.t tbody tr{background:var(--surface)}
.t tfoot td{font-weight:600;background:var(--surface-2)}
.cards{display:none;flex-direction:column;gap:8px}
.rcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.rcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rcard .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rcard .kv{font-size:.82rem;color:var(--muted)}
@media (max-width:767px){.tbl-wrap.resp{display:none}.cards{display:flex}}

/* detail header */
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dhead .facts{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}
.fact{display:flex;flex-direction:column;font-size:.85rem;min-width:0}
.fact b{font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px;color:var(--muted);font-weight:500}
.tabs button.on{border-color:var(--primary);color:var(--fg);font-weight:600}
:root[data-theme="dark"] .tabs button.on{border-color:var(--link)}
dl.kvs{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:.9rem}
dl.kvs dt{color:var(--muted)} dl.kvs dd{margin:0}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px;margin-left:3px}
:root[data-theme="dark"] .tl li::before{background:var(--link)}
.tl li::after{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--border)}
.tl li:last-child::after{display:none}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;counter-reset:s}
.steps span{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface-2)}
.steps span::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--border);font-size:.75rem;font-weight:700;color:var(--fg)}
.steps span.on{color:var(--fg);font-weight:600}
.steps span.on::before{background:var(--button);color:var(--button-fg)}
.steps span.done::before{content:"✓";background:var(--ok);color:#fff}

/* designs */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.dcard:hover{box-shadow:var(--shadow)}
.dcard .art{aspect-ratio:4/3;max-width:100%;background:var(--surface-2)}
.dcard .art svg{width:100%;height:100%;display:block}
.dcard .meta{padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.swatches{display:flex;gap:4px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--surface-2)}
.thumb svg{width:100%;height:100%;display:block}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h3{display:flex;justify-content:space-between;font-size:.88rem}
.kitem{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;font-size:.86rem}
.bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--chart-1)}
:root[data-theme="dark"] .bar i{background:var(--link)}

/* whats next */
.wn-group{display:flex;flex-direction:column;gap:6px}
.wn{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:.9rem;flex-wrap:wrap}
.wn .t1{flex:1 1 200px;min-width:0}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--info)}
.sev.warn{background:var(--warn)} .sev.danger{background:var(--danger)} .sev.ok{background:var(--ok)}

/* attendance */
.att{border-collapse:collapse;font-size:.8rem}
.att th,.att td{border:1px solid var(--border);text-align:center;padding:0;min-width:34px;height:34px}
.att th{background:var(--surface-2);font-weight:600;padding:4px}
.att td.name{text-align:left;padding:4px 10px;min-width:150px;position:sticky;left:0;background:var(--surface);white-space:nowrap}
.att button{width:100%;height:34px;border:0;background:transparent;cursor:pointer;font-weight:700}
.a-P{color:var(--ok)} .a-A{color:var(--danger);background:var(--danger-bg)!important} .a-H{color:var(--warn);background:var(--warn-bg)!important} .a-L{color:var(--info);background:var(--info-bg)!important} .a-O,.a-W{color:var(--muted);background:var(--surface-2)!important}

/* audit portal */
.aud-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);flex-wrap:wrap}
.aud-item .body{flex:1 1 180px;min-width:0}
.aud-item.found{border-color:var(--ok);background:color-mix(in oklab,var(--ok-bg) 60%,var(--surface))}
.aud-item.missing{border-color:var(--danger);background:color-mix(in oklab,var(--danger-bg) 60%,var(--surface))}

/* overlays */
.pop{position:absolute;right:8px;top:58px;width:min(380px,calc(100vw - 16px));background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);z-index:70;max-height:70vh;overflow:auto}
.pop .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.nitem{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:.88rem;cursor:pointer}
.nitem:hover{background:var(--hover)}
.nitem.unread{background:color-mix(in oklab,var(--info-bg) 50%,var(--surface))}
.umenu a{display:flex;gap:10px;align-items:center;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--fg);text-decoration:none}
.umenu a:hover{background:var(--hover)}
.modal-bg{position:fixed;inset:0;background:rgba(10,5,15,.5);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:480px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal .lines{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.9rem}
.modal .lines .tot{font-weight:700;border-top:1px solid var(--border);padding-top:6px}
.toasts{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:.9rem;max-width:340px}
@media (max-width:767px){.toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:16px;right:16px}}

/* prototype helper */
.proto{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80}
.proto > button{border-radius:999px;border:1px solid var(--border);background:var(--fg);color:var(--bg);padding:8px 14px;font-weight:600;font-size:.82rem;cursor:pointer;box-shadow:var(--shadow);min-height:40px}
.proto-panel{position:absolute;bottom:50px;right:0;width:min(330px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:.88rem;max-height:75vh;overflow:auto}
@media (max-width:767px){.proto{bottom:calc(74px + env(safe-area-inset-bottom,0px))}}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* branding editor */
.brand-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:1100px){.brand-grid{grid-template-columns:1fr}}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-row input[type=color]{width:44px;height:42px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface)}
.color-row .in{width:120px;font-family:var(--f-mono)}
.preset{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;min-height:44px;text-align:left}
.preset.on{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.cr{font-size:.8rem;font-weight:600}
.pv{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg);font-size:.82rem}
.pv-top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.pv-body{display:grid;grid-template-columns:120px minmax(0,1fr);min-height:190px}
.pv-side{padding:8px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border)}
.pv-side div{padding:5px 8px;border-radius:6px}
.pv-main{padding:10px;display:flex;flex-direction:column;gap:8px}
.pv-phone{width:200px;max-width:100%;border:6px solid var(--fg);border-radius:22px;overflow:hidden;background:var(--bg)}
.payslip{border:1px solid var(--border);border-radius:10px;padding:18px;background:var(--surface)}
.payslip .ph{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:10px;flex-wrap:wrap}
.screen-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.screen-index a{display:block;padding:4px 0;cursor:pointer;font-size:.9rem}
.flow{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.flow-step{flex:1 0 110px;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--fg);text-decoration:none;font-size:.86rem;min-height:44px}
.flow-step:hover{background:color-mix(in oklab,var(--secondary) 22%,var(--surface-2))}
.flow-step .ico{color:var(--link)}
.flow-arrow{align-self:center;color:var(--muted);flex:none}
@media (max-width:767px){.flow{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible}.flow-step{flex:none}.flow-arrow{display:none}}
.screen-index a{display:block}
.empty{text-align:center;padding:30px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* saree illustration: body colour, zari border band, pallu stripes, motif */
function sareeArt(c, b, motif = "butta") {
  const body = COLORS[c]?.hex || "#888", bord = COLORS[b]?.hex || "#c9a14a", gold = "#d8b45a";
  let m = "";
  if (motif === "lot") return `<svg viewBox="0 0 160 120"><rect width="160" height="120" fill="${body}"/><g fill="none" stroke="#b9a782" stroke-width="2">${[0,1,2,3,4,5].map(i => `<ellipse cx="80" cy="${30 + i * 12}" rx="${46 - i * 2}" ry="8"/>`).join("")}</g></svg>`;
  for (let y = 14; y < 78; y += 16) for (let x = 12; x < 108; x += 18) {
    const ox = ((y / 16) % 2) * 9;
    if (motif === "checks") m += `<rect x="${x + ox - 1}" y="${y - 6}" width="1.5" height="14" fill="${gold}" opacity=".7"/><rect x="${x + ox - 8}" y="${y}" width="16" height="1.5" fill="${gold}" opacity=".7"/>`;
    else if (motif === "dots") m += `<circle cx="${x + ox}" cy="${y}" r="1.6" fill="${gold}"/>`;
    else if (motif === "peacock") m += `<path d="M${x + ox} ${y - 5}c3 2 3 6 0 9c-3-3-3-7 0-9z" fill="${gold}"/>`;
    else if (motif === "rudra") m += `<circle cx="${x + ox}" cy="${y}" r="3" fill="none" stroke="${gold}" stroke-width="1.2"/>`;
    else if (motif === "border") m += `<rect x="${x + ox - 2}" y="${y - 2}" width="4" height="4" transform="rotate(45 ${x + ox} ${y})" fill="${gold}" opacity=".8"/>`;
    else m += `<path d="M${x + ox - 3} ${y + 2}q3-7 6 0z" fill="${gold}"/>`;
  }
  return `<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="${body}"/>${m}
  <rect x="112" y="0" width="48" height="120" fill="${bord}"/>${[118, 126, 134, 142, 150].map(x => `<rect x="${x}" y="0" width="3" height="120" fill="${gold}" opacity=".85"/>`).join("")}
  <rect x="0" y="86" width="112" height="34" fill="${bord}"/><rect x="0" y="90" width="112" height="2" fill="${gold}"/><rect x="0" y="113" width="112" height="2" fill="${gold}"/>
  ${[8, 26, 44, 62, 80, 98].map(x => `<path d="M${x} 108l5-11 5 11z" fill="${gold}"/>`).join("")}</svg>`;
}

  const pcols = cols.filter(c => (c.pri || 2) <= 2).slice(0, 6);
  const cards = `<div class="cards">${rows.map(r => `<div class="rcard" ${go ? goA(go, id(r)) : ""} role="button" tabindex="0">${cardThumb ? cardThumb(r) : ""}<div class="body">

/* ---------- charts (hand-drawn SVG, theme tokens) ---------- */
function comboChart(data) {
  const w = 640, h = 230, pl = 44, pb = 26, pt = 10, max = 1500;
  const bw = (w - pl - 10) / data.length;
  const y = v => pt + (h - pt - pb) * (1 - v / max);
  let s = "";
  [0, 500, 1000, 1500].forEach(t => s += `<line x1="${pl}" x2="${w - 6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t ? "₹" + (t / 100).toFixed(0) + "L" : "0"}</text>`);
  data.forEach((d, i) => {
    const x = pl + i * bw + bw * .14, bwi = bw * .34;
    s += `<rect x="${x}" y="${y(d[1])}" width="${bwi}" height="${y(0) - y(d[1])}" rx="2" fill="var(--chart-1)"><title>${T(d[0])}: ${T("Revenue")} ₹${d[1]}k</title></rect>`;
    s += `<rect x="${x + bwi + 2}" y="${y(d[2])}" width="${bwi}" height="${y(0) - y(d[2])}" rx="2" fill="var(--chart-2)"><title>${T("COGS")} ₹${d[2]}k</title></rect>`;
    s += `<text x="${pl + i * bw + bw / 2}" y="${h - 8}" text-anchor="middle">${T(d[0])}</text>`;
  });
  const pts = data.map((d, i) => `${pl + i * bw + bw / 2},${y(d[3])}`).join(" ");
  s += `<polyline points="${pts}" fill="none" stroke="var(--ok)" stroke-width="2.5"/>`;
  data.forEach((d, i) => s += `<circle cx="${pl + i * bw + bw / 2}" cy="${y(d[3])}" r="${i === data.length - 1 ? 4.5 : 2.5}" fill="var(--ok)"/>`);
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${T("Revenue, COGS and net profit, last 12 months")}">${s}</svg></div>
  <div class="legend"><span><i style="background:var(--chart-1)"></i>${T("Revenue")}</span><span><i style="background:var(--chart-2)"></i>${T("COGS")}</span><span><i style="background:var(--ok)"></i>${T("Net profit")}</span></div>`;
}
function hbars(rows, fmt = v => v, color = "var(--chart-1)") {
  const max = Math.max(...rows.map(r => r[1]));
  return `<div style="display:flex;flex-direction:column;gap:8px">${rows.map(([l, v, extra]) => `<div style="display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem">
  <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span><div class="bar" style="height:10px"><i style="width:${(v / max * 100).toFixed(1)}%;background:${color}"></i></div><span class="num">${fmt(v)}${extra || ""}</span></div>`).join("")}</div>`;
}

/* animated warp threads on auth panel */
let warpRAF;
function drawWarp() {
  cancelAnimationFrame(warpRAF);
  const cv = document.getElementById("warp"); if (!cv) return;
  const ctx = cv.getContext("2d"); const dpr = devicePixelRatio || 1;
  const resize = () => { cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr; };
  resize();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  const frame = () => {
    const w = cv.width, h = cv.height; ctx.clearRect(0, 0, w, h);
    for (let x = 0; x < w; x += 9 * dpr) { ctx.strokeStyle = (x / (9 * dpr)) % 7 === 0 ? "rgba(216,180,90,.55)" : "rgba(255,255,255,.08)"; ctx.lineWidth = dpr; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    const rows = Math.floor(h / (14 * dpr)); const woven = reduce ? rows * .6 : (t % (rows + 30));
    for (let r = 0; r < Math.min(rows, woven); r++) { const y = h - r * 14 * dpr; ctx.strokeStyle = r % 9 === 0 ? "rgba(216,180,90,.7)" : "rgba(255,255,255,.12)"; ctx.lineWidth = (r % 9 === 0 ? 3 : 1.4) * dpr; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    t += .12; if (!reduce) warpRAF = requestAnimationFrame(frame);
  };
  frame();
}

  auf: el => { const it = S.audit[+el.dataset.k]; it.state = it.state === el.dataset.v ? "" : el.dataset.v; render(); },
  auq: el => { S.audit[+el.dataset.k].qty = el.value; },
  auscan: () => { const v = (document.getElementById("au-scan")?.value || "").trim().toUpperCase(); const it = S.audit.find(i => i.code === v); if (it) { it.state = "found"; render(); toast(T("Marked found")); } else toast(T("Not in this audit. Recorded as an extra item.")); },
  bpreset: el => { const p = PRESETS[el.dataset.k]; Object.assign(S.draftBrand, { primary: p.primary, secondary: p.secondary, button: p.button, preset: el.dataset.k }); render(); },
  bcolor: el => { S.draftBrand[el.dataset.k] = el.value; S.draftBrand.preset = ""; render(); },
  bhex: el => { if (/^#[0-9a-fA-F]{6}$/.test(el.value)) { S.draftBrand[el.dataset.k] = el.value.toLowerCase(); S.draftBrand.preset = ""; render(); } },
  bset: el => { S.draftBrand[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; render(); },
  bname: el => { S.draftBrand[el.dataset.k] = el.value; },
  blogo: el => { const f = el.files?.[0]; if (!f) return; if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast(T("Only PNG, JPEG or WebP")); return; } if (f.size > 1048576) { toast(T("Logo must be 1 MB or smaller")); return; } const r = new FileReader(); r.onload = () => { S.draftBrand.logo = r.result; render(); }; r.readAsDataURL(f); },
  bsave: () => { S.brand = { ...S.draftBrand }; render(); toast(T("Branding saved for all users of this business")); },
  breset: () => { S.draftBrand = { ...S.brand, ...PRESETS.neutral, preset: "neutral", buttonText: "auto", sidebar: "light", logo: null, name: "Kanchi Silk Sarees" }; render(); }
};
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && a.tagName !== "SELECT" && a.tagName !== "INPUT") { e.preventDefault(); ACT[a.dataset.act]?.(a, e); return; }
  const gEl = e.target.closest("[data-go]");
  if (gEl) { e.preventDefault(); if (gEl.dataset.tabset) { const [t, k] = gEl.dataset.tabset.split(":"); S.tab[t] = k; } go(gEl.dataset.go, gEl.dataset.id); return; }
  if (S.pop && !e.target.closest(".pop")) { S.pop = null; render(); }
});
document.addEventListener("change", e => { const el = e.target.closest("[data-act-change]"); if (el) ACT[el.dataset.actChange]?.(el); });
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "codesearch") { S.searchQ = el.value; render(); return; }
  if (el.dataset.actInput) ACT[el.dataset.actInput]?.(el);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.(".rcard,[role=button]")) { e.target.click(); }
  if (e.key === "Enter" && e.target.id === "codesearch") { const q = S.searchQ.trim().toUpperCase(); const hit = CODE_INDEX().find(([c]) => c.includes(q)); if (hit) go(hit[2], hit[3]); }
  if (e.key === "Escape") { if (S.modal) { S.modal = null; render(); } else if (S.pop || S.drawer) { S.pop = null; S.drawer = false; render(); } }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && S.authed && S.role !== "auditor") { e.preventDefault(); S.searchOpen = true; render(); document.getElementById("codesearch")?.focus(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "login" || f === "register") { S.authed = true; if (f === "register") { S.role = "admin"; toast(T("Business registered. You are the owner admin.")); } go(S.role === "auditor" ? "audit-home" : "dashboard"); }
});
addEventListener("resize", () => { if (document.getElementById("warp")) drawWarp(); });

/* boot: open a bookmarked view if one is in the link */
(function boot() {
  try { if (matchMedia("(prefers-color-scheme: dark)").matches) {} } catch (e) {}
  const h = (location.hash || "").slice(1);
  if (PUBLIC[h]) S.route = h;
  else if (PAGES[h] || ALIAS[h]) { S.authed = true; go(h); return; }
  render();
})();
</script>
